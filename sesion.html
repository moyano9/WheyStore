<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Iniciar sesión - WHEYSTORE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">

  <!-- Misma fuente que en registro -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

  <!-- Reutilizamos EXACTAMENTE el mismo CSS -->
  <link rel="stylesheet" href="registro.css">
</head>
<body>

  <!-- NAVBAR ESTILO WHEYSTORE (igual que en registro, pero activo en Iniciar sesión) -->
  <nav class="navbar navbar-expand-lg navbar-whey fixed-top">
    <div class="container">
      
      <!-- LOGO WHEYSTORE -->
      <a class="navbar-brand marca-registro" href="index.html">
        <span class="bloque-whey">WHEY</span>
        <span class="texto-store">STORE</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#barraPrincipal">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="barraPrincipal">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="tienda.html">Tienda</a></li>
          <li class="nav-item"><a class="nav-link" href="registro.html">Registro</a></li>
          <li class="nav-item"><a class="nav-link active" href="sesion.html">Iniciar sesión</a></li>
          <li class="nav-item"><a class="nav-link" href="#">🛒</a></li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- CONTENIDO INICIAR SESIÓN -->
  <section class="fondo-registro">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-xl-5">

          <div class="tarjeta-registro p-4 p-md-5">
            <h1 class="h3 text-center mb-3">Iniciar sesión</h1>
            <p class="texto-suave text-center mb-4">
              Accede a tu cuenta de WHEYSTORE para ver tus pedidos y tus promociones.
            </p>

            <form action="#" method="post" novalidate>
              <div class="row g-3">

                <div class="col-12">
                  <label for="correo" class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="correo" name="correo" required>
                </div>

                <div class="col-12">
                  <label for="contrasena" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="contrasena" name="contrasena" required>
                </div>

                <div class="col-12 d-flex justify-content-between align-items-center">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="1" id="recordarme">
                    <label class="form-check-label texto-suave" for="recordarme">
                      Recordarme
                    </label>
                  </div>
                  <a href="#" class="enlace-claro small">¿Has olvidado la contraseña?</a>
                </div>

                <div class="col-12">
                  <button type="submit" class="btn btn-whey w-100 mt-2">
                    Entrar
                  </button>
                </div>
              </div>
            </form>

            <p class="texto-suave text-center mt-4 mb-0">
              ¿Aún no tienes cuenta?
              <a href="registro.html" class="enlace-claro">Regístrate aquí</a>.
            </p>
          </div>

        </div>
      </div>
    </div>
  </section>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>
</html>
